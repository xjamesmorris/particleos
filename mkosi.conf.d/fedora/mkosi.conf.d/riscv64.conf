[Match]
Architecture=riscv64

[Distribution]
# Fedora RISC-V rawhide can lag behind the stable release repositories.
Release=44

[Validation]
# Fedora's RISC-V firmware does not provide measured-boot PCRs yet.
SignExpectedPcr=no

[Runtime]
# TCG can take over 15 minutes to complete first-boot verity and repartition setup.
KernelCommandLineExtra=
    systemd.default_device_timeout_sec=1800
    systemd.default_timeout_start_sec=300

# QEMU exposes its RISC-V TPM through the device tree rather than ACPI.
TPM=yes
QemuArgs=
    -device
    tpm-tis-device,tpmdev=tpm0
    -machine
    acpi=off
